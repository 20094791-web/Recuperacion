<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shroud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rgb-strip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fan-blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcie-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- PCIe Slot Bracket (Left) -->
  <path d="M12 40 L22 40 L22 165 L12 165 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="8" y="32" width="6" height="15" rx="2" fill="#94a3b8"/>
  <rect x="8" y="158" width="6" height="15" rx="2" fill="#94a3b8"/>

  <!-- GPU Main Shroud Body -->
  <rect x="22" y="48" width="166" height="96" rx="8" fill="url(#shroud)" stroke="#38bdf8" stroke-width="1.8"/>

  <!-- RGB Accent Lines -->
  <path d="M26 54 H182" stroke="url(#rgb-strip)" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 138 H182" stroke="url(#rgb-strip)" stroke-width="2" stroke-linecap="round"/>

  <!-- Triple Cooling Fans -->
  <!-- Fan 1 -->
  <g transform="translate(52, 96)">
    <circle cx="0" cy="0" r="23" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M-6 -6 L-18 -14 M6 -6 L18 -14 M8 4 L20 10 M-8 4 L-20 10 M0 -8 V-21 M0 8 V21" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Fan 2 -->
  <g transform="translate(105, 96)">
    <circle cx="0" cy="0" r="23" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M-6 -6 L-18 -14 M6 -6 L18 -14 M8 4 L20 10 M-8 4 L-20 10 M0 -8 V-21 M0 8 V21" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Fan 3 -->
  <g transform="translate(158, 96)">
    <circle cx="0" cy="0" r="23" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M-6 -6 L-18 -14 M6 -6 L18 -14 M8 4 L20 10 M-8 4 L-20 10 M0 -8 V-21 M0 8 V21" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- PCIe Connector Teeth Bottom -->
  <rect x="40" y="145" width="70" height="9" fill="url(#pcie-gold)" rx="1"/>
  <rect x="115" y="145" width="25" height="9" fill="url(#pcie-gold)" rx="1"/>
  <line x1="45" y1="145" x2="45" y2="154" stroke="#78350f" stroke-width="1"/>
  <line x1="55" y1="145" x2="55" y2="154" stroke="#78350f" stroke-width="1"/>
  <line x1="65" y1="145" x2="65" y2="154" stroke="#78350f" stroke-width="1"/>
  <line x1="75" y1="145" x2="75" y2="154" stroke="#78350f" stroke-width="1"/>
  <line x1="85" y1="145" x2="85" y2="154" stroke="#78350f" stroke-width="1"/>
  <line x1="95" y1="145" x2="95" y2="154" stroke="#78350f" stroke-width="1"/>

  <!-- Power Connectors Top -->
  <rect x="145" y="42" width="22" height="6" fill="#475569" rx="1"/>
  <rect x="170" y="42" width="12" height="6" fill="#475569" rx="1"/>
</svg>
