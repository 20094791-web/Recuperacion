<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Cyber Hexagon Icon -->
  <g transform="translate(10, 10)">
    <polygon points="30,4 56,19 56,49 30,64 4,49 4,19" fill="#0f172a" stroke="url(#logo-grad)" stroke-width="2.5" />
    <polygon points="30,12 48,23 48,45 30,56 12,45 12,23" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
    <!-- CPU Die / Chip inside -->
    <rect x="22" y="26" width="16" height="16" rx="3" fill="url(#logo-grad)" filter="url(#neon-glow)" />
    <!-- Circuit lines -->
    <path d="M12 34 H22 M38 34 H48 M30 16 V26 M30 42 V52" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Text -->
  <text x="82" y="44" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="2" fill="#ffffff">PC<tspan fill="url(#logo-grad)">BUILDER</tspan></text>
  <text x="84" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="4" fill="#94a3b8">CUSTOM RIG PLATFORM</text>
</svg>
