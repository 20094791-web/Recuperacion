<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" fill="none">
  <defs>
    <linearGradient id="hero-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="hero-glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </linearGradient>
    <radialGradient id="holo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="250" cy="210" r="180" fill="url(#holo-glow)"/>

  <!-- Tech Hexagonal Grid in Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <polygon points="120,70 150,52 180,70 180,105 150,122 120,105" fill="none"/>
    <polygon points="320,70 350,52 380,70 380,105 350,122 320,105" fill="none"/>
    <polygon points="220,310 250,292 280,310 280,345 250,362 220,345" fill="none"/>
    <polygon points="70,220 100,202 130,220 130,255 100,272 70,255" fill="none"/>
    <polygon points="370,220 400,202 430,220 430,255 400,272 370,255" fill="none"/>
  </g>

  <!-- Ground Shadow & Floor Reflection -->
  <ellipse cx="250" cy="380" rx="170" ry="24" fill="#030712" opacity="0.8"/>
  <ellipse cx="250" cy="380" rx="130" ry="14" fill="url(#hero-neon)" opacity="0.2" filter="url(#neon-glow-filter)"/>

  <!-- PC Case Body (Fish-tank / Dual Chamber modern gaming tower) -->
  <!-- Main Chassis Shell -->
  <rect x="150" y="55" width="200" height="310" rx="14" fill="#090d16" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Tempered Glass Dual Panel (Front & Side) -->
  <rect x="160" y="68" width="180" height="235" rx="8" fill="rgba(15, 23, 42, 0.45)" stroke="#64748b" stroke-width="1.5"/>

  <!-- Rear Exhaust Fan with RGB -->
  <circle cx="185" cy="115" r="18" fill="#090d16" stroke="url(#hero-neon)" stroke-width="2.5"/>
  <circle cx="185" cy="115" r="6" fill="#38bdf8"/>

  <!-- Top 360mm Radiator & 3 RGB Fans -->
  <rect x="175" y="72" width="150" height="15" rx="3" fill="#1e293b"/>
  <circle cx="205" cy="80" r="6" fill="#00f0ff" opacity="0.9"/>
  <circle cx="250" cy="80" r="6" fill="#3b82f6" opacity="0.9"/>
  <circle cx="295" cy="80" r="6" fill="#8b5cf6" opacity="0.9"/>

  <!-- Motherboard Plate & CPU Liquid Cooler Pump -->
  <rect x="195" y="100" width="135" height="110" rx="4" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  
  <!-- CPU Cooler Infinity Mirror Pump -->
  <circle cx="245" cy="138" r="22" fill="#030712" stroke="url(#hero-neon)" stroke-width="3" filter="url(#neon-glow-filter)"/>
  <text x="245" y="142" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="10" fill="#ffffff">38°C</text>

  <!-- RAM Sticks with RGB Flow -->
  <rect x="282" y="112" width="5" height="36" rx="2" fill="url(#hero-neon)"/>
  <rect x="290" y="112" width="5" height="36" rx="2" fill="url(#hero-neon)"/>
  <rect x="298" y="112" width="5" height="36" rx="2" fill="url(#hero-neon)"/>
  <rect x="306" y="112" width="5" height="36" rx="2" fill="url(#hero-neon)"/>

  <!-- Cooler Tubes with RGB Fluid Effect -->
  <path d="M255 125 C 275 100, 275 88, 290 87" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M260 135 C 285 110, 285 92, 305 87" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- High-End GPU (Horizontal Mount with Anti-Sag Bracket) -->
  <g transform="translate(170, 218)">
    <!-- GPU Body -->
    <rect x="0" y="0" width="160" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- RGB Strip -->
    <line x1="8" y1="19" x2="152" y2="19" stroke="url(#hero-neon)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- GPU Fans (Bottom view silhouette) -->
    <circle cx="35" cy="19" r="12" fill="#090d16" stroke="#475569" stroke-width="1.2"/>
    <circle cx="80" cy="19" r="12" fill="#090d16" stroke="#475569" stroke-width="1.2"/>
    <circle cx="125" cy="19" r="12" fill="#090d16" stroke="#475569" stroke-width="1.2"/>
    <!-- Text / Model -->
    <text x="80" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="7" fill="#38bdf8" letter-spacing="1">GEFORCE RTX 4090</text>
  </g>

  <!-- PSU Shroud Basement (Bottom Compartment) -->
  <rect x="160" y="308" width="180" height="46" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="250" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="url(#hero-neon)" letter-spacing="3">PC BUILDER</text>

  <!-- Glass Light Reflection Streak -->
  <polygon points="175,70 235,70 190,300 165,300" fill="rgba(255, 255, 255, 0.04)"/>

  <!-- Power LED Indicator & Case Accents -->
  <circle cx="325" cy="62" r="2.5" fill="#00f0ff" filter="url(#neon-glow-filter)"/>
  <circle cx="316" cy="62" r="1.5" fill="#94a3b8"/>
  <line x1="165" y1="62" x2="230" y2="62" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Floating Holographic Data Badges Around the Rig -->
  <g transform="translate(340, 105)">
    <rect x="0" y="0" width="125" height="36" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#38bdf8">RENDIMIENTO MÁXIMO</text>
    <text x="12" y="28" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">4K Ultra • 165+ FPS</text>
  </g>

  <g transform="translate(35, 160)">
    <rect x="0" y="0" width="120" height="36" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#10b981" stroke-width="1.2"/>
    <text x="12" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#10b981">100% COMPATIBLE</text>
    <text x="12" y="28" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">Validación Automática</text>
  </g>

  <g transform="translate(35, 260)">
    <rect x="0" y="0" width="120" height="36" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="1.2"/>
    <text x="12" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#c084fc">CONTROL DE CONSUMO</text>
    <text x="12" y="28" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">Cálculo de TDP Real</text>
  </g>
</svg>
