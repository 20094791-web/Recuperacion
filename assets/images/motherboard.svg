<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="mobo-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="vrm-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="armor-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Motherboard PCB -->
  <rect x="18" y="18" width="164" height="164" rx="8" fill="url(#mobo-pcb)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Mounting Screw Holes -->
  <circle cx="28" cy="28" r="4" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="172" cy="28" r="4" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="28" cy="172" r="4" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="172" cy="172" r="4" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- Rear I/O Shield Cover / Left VRM Heatsink -->
  <path d="M22 28 H50 V95 H36 V125 H22 Z" fill="url(#vrm-metal)" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="25" y="32" width="20" height="8" rx="2" fill="#00f0ff" opacity="0.8"/>
  <text x="35" y="38" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#0f172a" font-weight="900">I/O</text>

  <!-- Top VRM Heatsink -->
  <rect x="54" y="24" width="70" height="18" rx="3" fill="url(#vrm-metal)" stroke="#475569" stroke-width="1"/>
  <line x1="60" y1="28" x2="118" y2="28" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- CPU Socket (Center Top) -->
  <rect x="62" y="48" width="54" height="54" rx="4" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="68" y="54" width="42" height="42" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <circle cx="89" cy="75" r="8" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- Socket Lever -->
  <rect x="117" y="52" width="3" height="46" rx="1.5" fill="#cbd5e1"/>

  <!-- RAM Slots (Right of CPU) -->
  <g transform="translate(128, 44)">
    <rect x="0" y="0" width="6" height="62" rx="1.5" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <rect x="10" y="0" width="6" height="62" rx="1.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <rect x="20" y="0" width="6" height="62" rx="1.5" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <rect x="30" y="0" width="6" height="62" rx="1.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- PCIe x16 Slot (Primary GPU Slot) -->
  <rect x="35" y="118" width="115" height="10" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="40" y1="123" x2="140" y2="123" stroke="#ffffff" stroke-width="1"/>
  <rect x="146" y="117" width="6" height="12" rx="1" fill="#38bdf8"/>

  <!-- M.2 Shield / Heatsink -->
  <rect x="45" y="134" width="70" height="14" rx="2" fill="url(#vrm-metal)" stroke="#38bdf8" stroke-width="1"/>
  <text x="80" y="144" text-anchor="middle" font-family="monospace" font-size="7" fill="#38bdf8">PCIe Gen 5 NVMe</text>

  <!-- Secondary PCIe Slot -->
  <rect x="35" y="156" width="115" height="7" rx="1" fill="#1e293b" stroke="#475569" stroke-width="1"/>

  <!-- Chipset Heatsink (Bottom Right) -->
  <rect x="125" y="130" width="46" height="38" rx="4" fill="url(#vrm-metal)" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="135,138 160,138 152,160 127,160" fill="url(#armor-grad)" opacity="0.3"/>
  <text x="148" y="152" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="8" fill="#ffffff">CHIPSET</text>
</svg>
